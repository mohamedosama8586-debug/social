<section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm" aria-label="Comments">
  <!-- Header -->
  <div class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-2">
      <h3 class="text-base font-bold text-slate-900">Comments</h3>

      <span class="bg-blue-100 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">
        {{ allComments().length }}
      </span>
    </div>

    <button class="text-sm text-slate-500 hover:text-blue-600 transition-colors">
      Most relevant
      <i class="fa-solid fa-chevron-down text-xs ms-1"></i>
    </button>
  </div>

  <!-- Comment Details -->
  @for (comment of allComments(); track $index) {
    <div class="flex gap-3 mb-5 group">
      <img
        [src]="comment.commentCreator.photo"
        [alt]="comment.commentCreator.name"
        class="w-10 h-10 rounded-full object-cover shrink-0 border border-slate-200"
      />

      <div class="flex-1 min-w-0">
        <div class="bg-slate-50 rounded-2xl rounded-tl-none p-3.5 border border-slate-100">
          <div class="flex items-center justify-between gap-2 mb-1">
            <span class="text-sm font-bold text-slate-900 hover:text-blue-600 cursor-pointer">
              {{ comment.commentCreator.name }}
            </span>

            <button class="text-slate-400 hover:text-slate-700 transition-colors">
              <i class="fa-solid fa-ellipsis"></i>
            </button>
          </div>

          <div class="flex items-center gap-1.5 text-xs text-slate-400 mb-2">
            <span>{{ comment.commentCreator.name }}</span>
          </div>

          <!-- Edit Comment / Show Comment -->
          @if (editingCommentId() === comment._id) {
            <textarea
              [formControl]="editContent"
              class="w-full bg-white border border-blue-300 rounded-xl p-3 text-sm outline-none"
            ></textarea>

            <div class="flex gap-2 mt-2">
              <button
                (click)="updateComment(comment._id)"
                [disabled]="editContent.invalid"
                class="bg-blue-600 text-white px-3 py-2 rounded-lg text-xs disabled:opacity-50"
              >
                Save
              </button>

              <button
                (click)="editingCommentId.set(null)"
                class="bg-slate-100 text-slate-600 px-3 py-2 rounded-lg text-xs"
              >
                Cancel
              </button>
            </div>
          } @else {
            <p class="text-sm leading-6 text-slate-700 break-words">
              {{ comment.content }}
            </p>
          }
        </div>

        <!-- Actions -->
        <div class="flex items-center gap-4 mt-2 ml-2 text-xs font-semibold text-slate-500">
          <span class="text-slate-400">6s</span>

          <button class="hover:text-blue-600 transition-colors">
            <i class="fa-regular fa-thumbs-up me-1"></i>
            {{ comment.likes }}
          </button>

          <button class="hover:text-blue-600 transition-colors">Reply</button>

          <button (click)="startEdit(comment)" class="hover:text-blue-600 transition-colors">
            <i class="fa-regular fa-pen-to-square me-1"></i>
            Edit
          </button>

          <button (click)="deleteComment(comment._id)" class="hover:text-red-600 transition-colors">
            <i class="fa-regular fa-trash-can me-1"></i>
            Delete
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Create Comment -->
  <div class="flex gap-3 pt-4 border-t border-slate-100">
    <img
      [src]="currentUser.photo"
      [alt]="currentUser.name"
      class="h-11 w-11 rounded-full object-cover"
    />

    <div class="flex-1 min-w-0">
      <div
        class="bg-slate-50 border border-slate-200 focus-within:border-blue-400 focus-within:ring-4 focus-within:ring-blue-50 focus-within:bg-white transition-all rounded-2xl p-3"
      >
        <textarea
          [formControl]="content"
          rows="2"
          placeholder="Write a comment..."
          class="w-full bg-transparent border-none text-sm text-slate-800 placeholder:text-slate-400 resize-none outline-none px-1 py-1 min-h-[65px]"
        ></textarea>

        <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-200">
          <div class="flex items-center gap-1">
            <input type="file" id="file" accept="image/*,video/*" class="hidden" />

            <label
              for="file"
              class="flex items-center gap-2 cursor-pointer text-slate-500 hover:text-green-600 hover:bg-green-50 px-3 py-2 rounded-xl transition-all"
            >
              <i class="fa-regular fa-image text-lg"></i>
              <span class="text-xs font-semibold">Photo/video</span>
            </label>
          </div>

          <button
            type="button"
            (click)="addComment()"
            [disabled]="content.invalid"
            class="flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white text-xs font-bold transition-all shadow-sm shadow-blue-200"
          >
            Comment
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
